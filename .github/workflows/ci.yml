name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Pinned rather than ubuntu-latest: reproducible runner, no migration notices.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          # No third-party deps, so no go.sum to key a cache on. Re-enable once one exists.
          cache: false
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
